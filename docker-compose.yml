# Run the App Service image locally.
#
#   docker compose up --build            UI + API on http://localhost:8000 (SQLite inside a volume)
#   bash scripts/local-e2e.sh            same, plus automated checks
#   docker compose --profile postgres up  optionally add PostgreSQL (see below)
#
# Settings come from your .env (git-ignored, same file the host-run backend uses);
# without one, placeholder IDs are used so the app still starts ("smoke" mode).
# Secrets are files in .secrets/ (git-ignored), mounted where the image expects
# them. Nothing secret is written in this file.

services:
  app:
    image: crip:local
    build:
      context: .
      args:
        # Fewer parallel npm connections: Docker Desktop's NAT resets connections under load.
        NPM_MAXSOCKETS: "4"
    env_file:
      - path: .env
        required: false
    environment:
      CRIP_TENANT_ID: ${CRIP_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      CRIP_API_CLIENT_ID: ${CRIP_API_CLIENT_ID:-00000000-0000-0000-0000-000000000001}
      CRIP_FOUNDRY_PROJECT_ENDPOINT: ${CRIP_FOUNDRY_PROJECT_ENDPOINT:-https://local-smoke.invalid/api/projects/none}
      # Without a .env, show the UI with clearly labelled SAMPLE data (no sign-in).
      # Set CRIP_UI_DEMO_MODE=false in .env to use real sign-in and live Azure data.
      CRIP_UI_DEMO_MODE: ${CRIP_UI_DEMO_MODE:-true}
      # Container paths override the host-oriented values in .env.
      CRIP_SECRETS_DIR: /app/.secrets
      CRIP_SQLITE_PATH: /home/data/crip.db
      CRIP_STATIC_DIR: /app/static
      CRIP_FOUNDRY_DEFINITIONS_DIR: /app/foundry/definitions
    volumes:
      - ./.secrets:/app/.secrets:ro
      - crip-data:/home/data
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: PostgreSQL instead of SQLite. Start with `--profile postgres` and put
  # postgresql://crip:<password>@postgres:5432/crip into .secrets/database-url.
  postgres:
    profiles: [postgres]
    image: postgres:16
    environment:
      POSTGRES_DB: crip
      POSTGRES_USER: crip
      POSTGRES_PASSWORD_FILE: /run/secrets/local_pg_password
    secrets: [local_pg_password]
    ports: ["5432:5432"]
    volumes:
      - crip-pg:/var/lib/postgresql/data

secrets:
  local_pg_password:
    file: ./.secrets/local-postgres-password

volumes:
  crip-data:
  crip-pg:
