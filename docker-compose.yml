# Local PostgreSQL only (stands in for the shared Flexible Server allocation).
# The password comes from a git-ignored file generated by
# `python scripts/init_local_secrets.py`; nothing secret is written here.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crip
      POSTGRES_USER: crip
      POSTGRES_PASSWORD_FILE: /run/secrets/local_pg_password
    secrets: [local_pg_password]
    ports: ["5432:5432"]
    volumes:
      # Creates the "crip" schema, mirroring the landing-zone schema allocation.
      - ./scripts/local-postgres-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - crip-pg:/var/lib/postgresql/data

secrets:
  local_pg_password:
    file: ./.secrets/local-postgres-password

volumes:
  crip-pg:
