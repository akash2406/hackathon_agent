{{- if .Values.ingress.enabled }}
{{- include "crip.validateAllocations" . -}}
# Exposes the frontend only; nginx in the frontend pod proxies /api to the
# backend Service, so the backend is never directly reachable from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "crip.fullname" . }}
  labels:
    {{- include "crip.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crip.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
