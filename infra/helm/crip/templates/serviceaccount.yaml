{{- include "crip.validateAllocations" . -}}
# Workload Identity: pods using this service account receive a projected token
# that Entra exchanges for (a) the managed identity from allocation #4 - used by
# DefaultAzureCredential for Foundry and by the Key Vault CSI driver - and
# (b) the backend API app registration's credential for the OBO exchange
# (federated credential on allocation #6).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "crip.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.allocations.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.allocations.entra.tenantId | quote }}
