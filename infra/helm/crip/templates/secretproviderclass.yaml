{{- include "crip.validateAllocations" . -}}
{{- $kv := .Values.allocations.keyVault -}}
# Key Vault CSI driver: mounts the secrets named below as files under
# /mnt/secrets-store in the backend pod, authenticating with Workload Identity.
# Secret values never appear in manifests, env vars or the image.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "crip.fullname" . }}-kv
  labels:
    {{- include "crip.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.allocations.workloadIdentity.clientId | quote }}
    keyvaultName: {{ $kv.name | quote }}
    tenantId: {{ $kv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $kv.postgresConnectionStringSecret }}
          objectType: secret
        - |
          objectName: {{ $kv.appInsightsConnectionStringSecret }}
          objectType: secret
