{{- if .Values.registerAgents.enabled }}
{{- include "crip.validateAllocations" . -}}
# Registers/updates the Orchestrator and CostPulse agents in Foundry after every
# install/upgrade, using the release's Workload Identity (allocation #7 grants it
# agent create/update). Runs from the backend image, which contains foundry/.
# Post- (not pre-) hook because the ServiceAccount must already exist; the
# backend resolves agents lazily by name, so it tolerates the short gap.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crip.fullname" . }}-register-agents
  labels:
    {{- include "crip.labels" . | nindent 4 }}
    app.kubernetes.io/component: register-agents
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "crip.selector" . | nindent 8 }}
        app.kubernetes.io/component: register-agents
        crip/egress: azure
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "crip.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: register-agents
          image: {{ include "crip.image" (dict "root" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/foundry/register_agents.py"]
          env:
            {{- include "crip.backendEnv" . | nindent 12 }}
          securityContext:
            {{- include "crip.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.registerAgents.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
