# Environment: dev. Committed to git: identifiers only, NEVER secrets.
# Fill the "<...>" values (docs/azure-setup.md explains where each comes from).

variables:
  # Azure Resource Manager service connection (Project settings -> Service connections).
  # Needs Contributor on the resource group (enough for the Bicep stage too: the
  # template creates no role assignments).
  azureServiceConnection: "<arm-service-connection-name>"

  resourceGroup: "<rg-crip-dev>"
  location: "westeurope"
  # Prefix for resource names created by Bicep (3-20 chars: lowercase letters, digits, hyphens).
  namePrefix: "crip-dev"
  appServiceSku: "B1"

  # Entra app registration (scripts/setup-entra-app.sh prints this).
  apiClientId: "<app-registration-client-id>"
  spaClientId: ""                     # only if the SPA has its own registration
  # Access model (docs/access-model.md): app_identity (CRIP's identity reads Azure, CRIP checks
  # each user's RBAC / app roles / groups) or user_obo (every call as the user).
  azureAccessMode: "app_identity"
  managementGroupId: "<management-group-id>"
  platformAdminGroupIds: ""            # optional Entra group object ids, comma-separated
  costReaderGroupIds: ""
  readerGroupIds: ""
  # user_obo mode only: managed_identity (no secret) or client_secret (+ oboClientSecretKeyVaultUri).
  oboCredentialMode: "managed_identity"
  oboClientSecretKeyVaultUri: ""

  # Azure AI Foundry project + model deployment that supports tool calling.
  foundryProjectEndpoint: "https://<resource>.services.ai.azure.com/api/projects/<project>"
  foundryModelDeployment: "gpt-4o"

  # TEMPORARY: "true" serves the UI with labelled SAMPLE data and no sign-in, so the site can be
  # deployed before the app registration exists. Set "false" once apiClientId is real.
  uiDemoMode: "false"

  # Optional override. Leave empty to read it from the Bicep deployment outputs.
  webAppName: ""
