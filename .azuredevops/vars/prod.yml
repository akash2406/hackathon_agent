# Environment: prod. Same shape as dev.yml. Deployed only from main, after approval.
# Committed to git: identifiers only, NEVER secrets.

variables:
  azureServiceConnection: "<arm-service-connection-name>"

  resourceGroup: "<rg-crip-prod>"
  location: "westeurope"
  namePrefix: "crip-prod"
  appServiceSku: "P0v3"

  apiClientId: "<app-registration-client-id>"
  spaClientId: ""
  azureAccessMode: "app_identity"
  managementGroupId: "<management-group-id>"
  platformAdminGroupIds: ""
  costReaderGroupIds: ""
  readerGroupIds: ""
  oboCredentialMode: "managed_identity"
  oboClientSecretKeyVaultUri: ""

  foundryProjectEndpoint: "https://<resource>.services.ai.azure.com/api/projects/<project>"
  foundryModelDeployment: "gpt-4o"

  # Keep "false" in prod (sample-data preview without sign-in; see dev.yml).
  uiDemoMode: "false"

  webAppName: ""
