# Pipeline variables shared by every environment.
# Committed to git: identifiers only, NEVER secrets.

variables:
  # Empty = Microsoft-hosted ubuntu-latest. Set to your self-hosted pool name to use it
  # (agents need Python 3.12, Node 22, Docker and the Azure CLI; see docs/pipeline.md).
  agentPoolName: ""
  pythonExecutable: python3

  # Image name inside ACR: <acr>.azurecr.io/<imageRepository>:<build id>
  imageRepository: crip
  # Name of the Bicep deployment the pipeline creates / reads outputs from.
  deploymentName: crip-appservice

  # Secret scanner image (used only if the agent has no gitleaks binary).
  gitleaksImage: zricethezav/gitleaks:v8.30.1

  # Who may approve prod deployments (ManualValidation), comma-separated.
  approvers: "<approver@contoso.com>"
