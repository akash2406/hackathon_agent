# CRIP CI/CD -> Azure App Service (one container image: UI + API).
#
#   Build      tests, UI build, secret scan                           (every PR and push)
#   Provision  Bicep: identity, ACR, App Insights, plan, web app      (only when provisionInfra=true)
#   Package    docker build, push to ACR as :<build id> and :latest   (not for PRs)
#   Approve    manual gate                                            (prod only)
#   Deploy     point the web app at the new image, smoke-test the URL
#
# Settings live in committed variable files (identifiers only, no secrets):
#   .azuredevops/vars/common.yml, .azuredevops/vars/<env>.yml
# Azure access is one Azure Resource Manager service connection (see docs/pipeline.md).
# Packages are downloaded from the public npm / PyPI registries.

parameters:
  - name: targetEnvironment
    displayName: Target environment (selects .azuredevops/vars/<env>.yml)
    type: string
    default: dev
    values: [dev, prod]
  - name: provisionInfra
    displayName: Run the Bicep template first (create/update Azure resources)
    type: boolean
    default: false
  - name: deploy
    displayName: Deploy after packaging
    type: boolean
    default: true

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

variables:
  - template: vars/common.yml
  - template: vars/${{ parameters.targetEnvironment }}.yml
  - name: imageTag
    value: $(Build.BuildId)

# Microsoft-hosted Ubuntu unless a self-hosted pool is named in the variable files.
pool:
  ${{ if eq(variables.agentPoolName, '') }}:
    vmImage: ubuntu-latest
  ${{ else }}:
    name: ${{ variables.agentPoolName }}

stages:
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: Build and test
    jobs:
      - job: backend
        displayName: Backend tests
        steps:
          - ${{ if eq(variables.agentPoolName, '') }}:
              - task: UsePythonVersion@0
                inputs: { versionSpec: "3.12" }
          - template: templates/agent-prereqs.yml
            parameters: { tools: [python] }
          - bash: |
              set -euo pipefail
              "$(pythonExecutable)" -m venv "$(Agent.TempDirectory)/venv"
              . "$(Agent.TempDirectory)/venv/bin/activate"
              python -m pip install --upgrade pip
              pip install -e "backend[dev]"
              python -m pytest --junitxml="$(Agent.TempDirectory)/test-results.xml"
            displayName: pytest
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: $(Agent.TempDirectory)/test-results.xml
              testRunTitle: backend

      - job: frontend
        displayName: Web UI build
        steps:
          - ${{ if eq(variables.agentPoolName, '') }}:
              - task: NodeTool@0
                inputs: { versionSpec: "22.x" }
          - template: templates/agent-prereqs.yml
            parameters: { tools: [node] }
          - bash: npm ci --no-audit --no-fund && npm run build
            workingDirectory: frontend
            displayName: npm ci + build (includes tsc typecheck)

      - job: secrets
        displayName: Secret scan
        steps:
          - bash: |
              set -euo pipefail
              if command -v gitleaks > /dev/null 2>&1; then
                gitleaks dir "$(Build.SourcesDirectory)" --config "$(Build.SourcesDirectory)/.gitleaks.toml" --redact --verbose
              else
                docker run --rm -v "$(Build.SourcesDirectory):/repo" "$(gitleaksImage)" \
                  dir /repo --config /repo/.gitleaks.toml --redact --verbose
              fi
            displayName: gitleaks (fails the build on any hardcoded secret)

  # ---------------------------------------------------------------------------
  - ${{ if eq(parameters.provisionInfra, true) }}:
      - stage: Provision
        displayName: Provision Azure resources (Bicep)
        dependsOn: Build
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        jobs:
          - job: bicep
            steps:
              - template: templates/validate-variables.yml
                parameters:
                  varsFile: .azuredevops/vars/${{ parameters.targetEnvironment }}.yml
                  names: [resourceGroup, namePrefix, apiClientId, foundryProjectEndpoint, foundryModelDeployment]
              - task: AzureCLI@2
                displayName: az deployment group create
                inputs:
                  azureSubscription: ${{ variables.azureServiceConnection }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    az group create -n "$(resourceGroup)" -l "$(location)" -o none
                    az deployment group create -g "$(resourceGroup)" -n "$(deploymentName)" \
                      -f infra/appservice/main.bicep \
                      -p namePrefix="$(namePrefix)" apiClientId="$(apiClientId)" spaClientId="$(spaClientId)" \
                         foundryProjectEndpoint="$(foundryProjectEndpoint)" foundryModelDeployment="$(foundryModelDeployment)" \
                         oboCredentialMode="$(oboCredentialMode)" oboClientSecretKeyVaultUri="$(oboClientSecretKeyVaultUri)" \
                         appServiceSku="$(appServiceSku)" \
                      --query properties.outputs -o json

  # ---------------------------------------------------------------------------
  - stage: Package
    displayName: Build + push image (${{ parameters.targetEnvironment }})
    ${{ if eq(parameters.provisionInfra, true) }}:
      dependsOn: Provision
    ${{ else }}:
      dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: image
        steps:
          - template: templates/agent-prereqs.yml
            parameters: { tools: [docker, az] }
          - template: templates/resolve-names.yml
          - task: AzureCLI@2
            displayName: docker build + push to ACR
            inputs:
              azureSubscription: ${{ variables.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export DOCKER_BUILDKIT=1
                az acr login --name "$(acrName)"
                image="$(acrLoginServer)/$(imageRepository)"
                docker build -t "$image:$(imageTag)" -t "$image:latest" \
                  --label org.opencontainers.image.revision="$(Build.SourceVersion)" .
                docker push "$image:$(imageTag)"
                docker push "$image:latest"
                docker image rm -f "$image:$(imageTag)" "$image:latest" > /dev/null || true

  # ---------------------------------------------------------------------------
  - ${{ if eq(parameters.deploy, true) }}:
      - ${{ if eq(parameters.targetEnvironment, 'prod') }}:
          - stage: Approve
            displayName: Approve prod deployment
            dependsOn: Package
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            jobs:
              - job: approve
                pool: server   # agentless: holds no agent while waiting
                timeoutInMinutes: 1440
                steps:
                  - task: ManualValidation@1
                    timeoutInMinutes: 1440
                    inputs:
                      notifyUsers: $(approvers)
                      approvers: $(approvers)
                      instructions: Approve deployment of CRIP image $(imageTag) to prod.
                      onTimeout: reject

      - stage: Deploy
        displayName: Deploy to App Service (${{ parameters.targetEnvironment }})
        ${{ if eq(parameters.targetEnvironment, 'prod') }}:
          dependsOn: Approve
        ${{ else }}:
          dependsOn: Package
        condition: succeeded()
        jobs:
          - deployment: webapp
            environment: crip-${{ parameters.targetEnvironment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - template: templates/agent-prereqs.yml
                      parameters: { tools: [az] }
                    - template: templates/resolve-names.yml
                    - task: AzureWebAppContainer@1
                      displayName: Point web app at $(imageRepository):$(imageTag)
                      inputs:
                        azureSubscription: ${{ variables.azureServiceConnection }}
                        appName: $(webAppName)
                        resourceGroupName: $(resourceGroup)
                        containers: $(acrLoginServer)/$(imageRepository):$(imageTag)
                    - bash: |
                        set -uo pipefail
                        url="$(webAppUrl)"
                        echo "Waiting for $url to serve the new image (container pull + start can take a few minutes)..."
                        for i in $(seq 1 40); do
                          if curl -fsS --max-time 10 "$url/health/live" > /dev/null; then break; fi
                          sleep 15
                        done
                        curl -fsS --max-time 10 "$url/health" || { echo "##vso[task.logissue type=error]$url/health is not OK"; exit 1; }
                        code=$(curl -sS -o /tmp/chat.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"message":"ping"}' "$url/api/chat")
                        grep -q '"unauthenticated"' /tmp/chat.json && [ "$code" = 401 ] \
                          || { echo "##vso[task.logissue type=error]expected 401 envelope from /api/chat, got $code"; exit 1; }
                        curl -fsS "$url/" | grep -q 'id="root"' || { echo "##vso[task.logissue type=error]UI not served at $url/"; exit 1; }
                        echo "CRIP is live at $url"
                      displayName: Smoke test the live app
