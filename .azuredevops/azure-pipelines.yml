# CRIP CI/CD -> Azure App Service (one container image: UI + API).
#
#   Build      tests, UI build, secret scan                           (every PR and push)
#   Provision  Bicep: identity, App Insights, plan, Python web app      (only when provisionInfra=true)
#   Package    zip: API + agent definitions + built UI (artifact)      (not for PRs)
#   Approve    manual gate                                            (prod only)
#   Deploy     scripts/deploy.py: app settings, agents, zip deploy, smoke test
#
# Settings live in committed variable files (identifiers only, no secrets):
#   .azuredevops/vars/common.yml, .azuredevops/vars/<env>.yml
# Azure access is one Azure Resource Manager service connection (see docs/pipeline.md).
# Packages are downloaded from the public npm / PyPI registries.

parameters:
  - name: targetEnvironment
    displayName: Target environment (selects .azuredevops/vars/<env>.yml)
    type: string
    default: dev
    values: [dev, prod]
  - name: provisionInfra
    displayName: Run the Bicep template first (create/update Azure resources)
    type: boolean
    default: false
  - name: deploy
    displayName: Deploy after packaging
    type: boolean
    default: true

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

variables:
  - template: vars/common.yml
  - template: vars/${{ parameters.targetEnvironment }}.yml

# Microsoft-hosted Ubuntu unless a self-hosted pool is named in the variable files.
pool:
  ${{ if eq(variables.agentPoolName, '') }}:
    vmImage: ubuntu-latest
  ${{ else }}:
    name: ${{ variables.agentPoolName }}

stages:
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: Build and test
    jobs:
      - job: backend
        displayName: Backend tests
        steps:
          - ${{ if eq(variables.agentPoolName, '') }}:
              - task: UsePythonVersion@0
                inputs: { versionSpec: "3.12" }
          - template: templates/agent-prereqs.yml
            parameters: { tools: [python] }
          - bash: |
              set -euo pipefail
              "$(pythonExecutable)" -m venv "$(Agent.TempDirectory)/venv"
              . "$(Agent.TempDirectory)/venv/bin/activate"
              python -m pip install --upgrade pip
              pip install -e "backend[dev]"
              python -m pytest --junitxml="$(Agent.TempDirectory)/test-results.xml"
            displayName: pytest
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: $(Agent.TempDirectory)/test-results.xml
              testRunTitle: backend

      - job: frontend
        displayName: Web UI build
        steps:
          - ${{ if eq(variables.agentPoolName, '') }}:
              - task: NodeTool@0
                inputs: { versionSpec: "22.x" }
          - template: templates/agent-prereqs.yml
            parameters: { tools: [node] }
          - bash: npm ci --no-audit --no-fund && npm run build
            workingDirectory: frontend
            displayName: npm ci + build (includes tsc typecheck)

      - job: secrets
        displayName: Secret scan
        steps:
          - bash: |
              set -euo pipefail
              if command -v gitleaks > /dev/null 2>&1; then
                gitleaks dir "$(Build.SourcesDirectory)" --config "$(Build.SourcesDirectory)/.gitleaks.toml" --redact --verbose
              else
                docker run --rm -v "$(Build.SourcesDirectory):/repo" "$(gitleaksImage)" \
                  dir /repo --config /repo/.gitleaks.toml --redact --verbose
              fi
            displayName: gitleaks (fails the build on any hardcoded secret)

  # ---------------------------------------------------------------------------
  - ${{ if eq(parameters.provisionInfra, true) }}:
      - stage: Provision
        displayName: Provision Azure resources (Bicep)
        dependsOn: Build
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        jobs:
          - job: bicep
            steps:
              - template: templates/validate-variables.yml
                parameters:
                  varsFile: .azuredevops/vars/${{ parameters.targetEnvironment }}.yml
                  names: [resourceGroup, namePrefix, apiClientId, foundryProjectEndpoint, foundryModelDeployment]
              - task: AzureCLI@2
                displayName: Bicep via scripts/deploy.py --steps provision
                inputs:
                  azureSubscription: ${{ variables.azureServiceConnection }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    "$(pythonExecutable)" scripts/deploy.py --env ${{ parameters.targetEnvironment }} --steps provision

  # ---------------------------------------------------------------------------
  - stage: Package
    displayName: Build code package (${{ parameters.targetEnvironment }})
    ${{ if eq(parameters.provisionInfra, true) }}:
      dependsOn: Provision
    ${{ else }}:
      dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: package
        steps:
          - ${{ if eq(variables.agentPoolName, '') }}:
              - task: UsePythonVersion@0
                inputs: { versionSpec: "3.12" }
              - task: NodeTool@0
                inputs: { versionSpec: "22.x" }
          - template: templates/agent-prereqs.yml
            parameters: { tools: [python, node] }
          - bash: |
              set -euo pipefail
              "$(pythonExecutable)" scripts/build_package.py --out "$(Build.ArtifactStagingDirectory)/crip-app.zip"
            displayName: Build zip (API + agent definitions + built UI)
          - publish: $(Build.ArtifactStagingDirectory)/crip-app.zip
            artifact: app
            displayName: Publish package artifact

  # ---------------------------------------------------------------------------
  - ${{ if eq(parameters.deploy, true) }}:
      - ${{ if eq(parameters.targetEnvironment, 'prod') }}:
          - stage: Approve
            displayName: Approve prod deployment
            dependsOn: Package
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            jobs:
              - job: approve
                pool: server   # agentless: holds no agent while waiting
                timeoutInMinutes: 1440
                steps:
                  - task: ManualValidation@1
                    timeoutInMinutes: 1440
                    inputs:
                      notifyUsers: $(approvers)
                      approvers: $(approvers)
                      instructions: Approve deployment of CRIP build $(Build.BuildNumber) to prod.
                      onTimeout: reject

      - stage: Deploy
        displayName: Deploy to App Service (${{ parameters.targetEnvironment }})
        ${{ if eq(parameters.targetEnvironment, 'prod') }}:
          dependsOn: Approve
        ${{ else }}:
          dependsOn: Package
        condition: succeeded()
        jobs:
          - deployment: webapp
            environment: crip-${{ parameters.targetEnvironment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - download: current
                      artifact: app
                    - template: templates/agent-prereqs.yml
                      parameters: { tools: [python, az] }
                    - task: AzureCLI@2
                      displayName: App settings + agents + code + smoke test (scripts/deploy.py)
                      inputs:
                        azureSubscription: ${{ variables.azureServiceConnection }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          # --agents app: the web app registers the Foundry agents at startup with its
                          # managed identity, so the service connection needs no Foundry role.
                          "$(pythonExecutable)" scripts/deploy.py --env ${{ parameters.targetEnvironment }} \
                            --steps settings,agents,code --agents app \
                            --package "$(Pipeline.Workspace)/app/crip-app.zip"
