# Points every pip in the job at the internal Nexus PyPI repository.
#
# Writes two pip config files into $(Agent.TempDirectory) (wiped after the job):
#   pip.conf         for pip on the agent; exported via PIP_CONFIG_FILE for later steps
#   pip-docker.conf  for `docker build`, passed as a BuildKit secret, so the index
#                    URL (and any credentials) never land in an image layer
#
# Inputs:
#   pipIndexUrl       vars/common.yml   e.g. https://nexus.example.com/repository/pypi-group/simple
#   pipCaBundlePath   vars/common.yml   optional PEM bundle on the agent for the corporate CA
#   nexusUsername     SECRET pipeline variable (Pipeline > Edit > Variables), optional
#   nexusPassword     SECRET pipeline variable, optional
# Credentials are only needed if Nexus does not allow anonymous reads. They are
# never stored in the repository.

steps:
  - bash: |
      set -euo pipefail
      # Unset pipeline variables arrive as the literal text "$(name)".
      unset_if_literal() { local v="${!1:-}"; [[ "$v" == '$('* ]] && v=""; printf '%s' "$v"; }
      index_url="$(unset_if_literal PIP_INDEX_URL_BASE)"
      user="$(unset_if_literal NEXUS_USERNAME)"
      pass="$(unset_if_literal NEXUS_PASSWORD)"
      ca="$(unset_if_literal PIP_CA_BUNDLE)"

      if [ -z "$index_url" ] || [[ "$index_url" == *"<"*">"* ]]; then
        echo "##vso[task.logissue type=error]pipIndexUrl is not set in .azuredevops/vars/common.yml (internal Nexus PyPI URL)"
        exit 1
      fi
      if [[ "$index_url" != https://* ]]; then
        echo "##vso[task.logissue type=error]pipIndexUrl must be https:// (plain HTTP would expose packages and credentials to tampering)"
        exit 1
      fi

      if [ -n "$user" ] && [ -n "$pass" ]; then
        enc() { "$PYTHON_EXE" -c 'import sys, urllib.parse as u; print(u.quote(sys.argv[1], safe=""))' "$1"; }
        index_url="https://$(enc "$user"):$(enc "$pass")@${index_url#https://}"
        echo "##vso[task.setsecret]$index_url"
        echo "Using authenticated Nexus index."
      else
        echo "Using anonymous Nexus index (set secret variables nexusUsername/nexusPassword if Nexus requires auth)."
      fi

      out="$(Agent.TempDirectory)"
      umask 077
      {
        echo "[global]"
        echo "index-url = $index_url"
        echo "timeout = 60"
        echo "retries = 5"
        if [ -n "$ca" ]; then echo "cert = $ca"; fi
      } > "$out/pip.conf"
      {
        echo "[global]"
        echo "index-url = $index_url"
        echo "timeout = 60"
        echo "retries = 5"
        if [ -n "$ca" ]; then echo "cert = /run/secrets/pipca"; fi
      } > "$out/pip-docker.conf"

      if [ -n "$ca" ] && [ ! -f "$ca" ]; then
        echo "##vso[task.logissue type=error]pipCaBundlePath '$ca' does not exist on agent '$AGENT_NAME'"
        exit 1
      fi

      echo "##vso[task.setvariable variable=PIP_CONFIG_FILE]$out/pip.conf"
      echo "pip configured for Nexus: ${PIP_INDEX_URL_BASE}"
    displayName: Configure pip for internal Nexus
    env:
      PIP_INDEX_URL_BASE: $(pipIndexUrl)
      PIP_CA_BUNDLE: $(pipCaBundlePath)
      NEXUS_USERNAME: $(nexusUsername)
      NEXUS_PASSWORD: $(nexusPassword)
      PYTHON_EXE: $(pythonExecutable)
