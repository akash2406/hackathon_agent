# Verifies the agent has the tools a job needs and prints their versions.
# Microsoft-hosted agents have them all; on a self-hosted pool missing tools
# fail fast with a clear message instead of an obscure error later.

parameters:
  - name: tools
    type: object   # any of: python, node, docker, az

steps:
  - bash: |
      failed=0
      need() {
        if ! command -v "$1" > /dev/null 2>&1; then
          echo "##vso[task.logissue type=error]Self-hosted agent '$AGENT_NAME' is missing '$1' ($2)"
          failed=1
        else
          echo "$1: $("$1" $3 2>&1 | head -n 1)"
        fi
      }
      for tool in $REQUIRED_TOOLS; do
        case "$tool" in
          python)  need "$PYTHON_EXE" "Python 3.12+ is required for the backend tests" "--version" ;;
          node)    need node "Node.js 20.19+/22 is required for the UI build" "--version"
                   need npm "npm is required for the frontend build" "--version" ;;
          docker)  need docker "Docker is required for this step" "--version" ;;
          az)      need az "Azure CLI is required for deployment" "version --output tsv" ;;
          *)       echo "##vso[task.logissue type=error]Unknown prerequisite '$tool'"; failed=1 ;;
        esac
      done
      exit $failed
    displayName: Check self-hosted agent prerequisites
    env:
      REQUIRED_TOOLS: ${{ join(' ', parameters.tools) }}
      PYTHON_EXE: $(pythonExecutable)
