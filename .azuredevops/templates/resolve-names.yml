# Resolves webAppName / webAppUrl for later steps.
#
# Uses the explicit value from the variable file if set; otherwise reads the
# outputs of the Bicep deployment (name $(deploymentName)) in $(resourceGroup).
# So it works whether the infrastructure came from this pipeline, from a manual
# `az deployment group create`, or was created by hand.

steps:
  - task: AzureCLI@2
    displayName: Resolve web app name
    inputs:
      azureSubscription: ${{ variables.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        literal() { [[ "$1" == '$('* || "$1" == *"<"*">"* ]] && echo "" || echo "$1"; }
        app="$(literal "$(webAppName)")"
        if [ -z "$app" ]; then
          app=$(az deployment group show -g "$(resourceGroup)" -n "$(deploymentName)" --query properties.outputs.webAppName.value -o tsv) || {
            echo "##vso[task.logissue type=error]No Bicep deployment '$(deploymentName)' in $(resourceGroup). Run with provisionInfra=true or set webAppName in the variable file."
            exit 1; }
        fi
        host=$(az webapp show -g "$(resourceGroup)" -n "$app" --query defaultHostName -o tsv)
        echo "Web app: $app (https://$host)"
        echo "##vso[task.setvariable variable=webAppName]$app"
        echo "##vso[task.setvariable variable=webAppUrl]https://$host"
