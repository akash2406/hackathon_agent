# Serves the SPA and reverse-proxies /api to the backend, so the browser talks
# to a single origin (no CORS configuration needed on the backend).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent runs (Orchestrator -> CostPulse -> Cost Management) can take a while.
        proxy_read_timeout 180s;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
