[project]
name = "crip-backend"
version = "0.2.0"
description = "CRIP: FastAPI backend + web UI host that drives Foundry-hosted agents and executes their Azure tools on behalf of the signed-in user."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "msal>=1.31",
    "pyjwt[crypto]>=2.9",
    "azure-identity>=1.19",
    "azure-ai-agents>=1.1,<2",
    "aiohttp>=3.10",
    "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crip_backend"]
